title: Kerberoasting Attack Detection
id: 59374020-abcd-1234-9876-fedcba098765
status: experimental
description: Detects Kerberoasting behavior by identifying multiple service ticket requests (Event 4769) for legacy RC4 encryption (0x17) from a single host.
references:
  - https://attack.mitre.org/techniques/T1558/003/
author: Agency SOC Team
date: 2026-06-19
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'
  filter:
    TargetUserName|endswith: '$' # Exclude computer accounts requesting tickets
  condition: selection and not filter
falsepositives:
  - Legacy Windows services running under service accounts that only support RC4.
level: medium
tags:
  - attack.credential_access
  - attack.t1558.003
