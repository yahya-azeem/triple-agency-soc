---
# CAT I Hardening Controls

- name: Secure SSH configuration
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: 'sshd -t -f %s'
  notify: Restart sshd

- name: Enforce login banner
  copy:
    content: "WARNING: Authorized access only. All activities are monitored and recorded."
    dest: /etc/issue.net
    owner: root
    group: root
    mode: '0644'

- name: Ensure SSH protocol 2 is enforced
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Protocol'
    line: 'Protocol 2'
  notify: Restart sshd

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: Restart sshd
