all:
  children:
    # Tier 0 - Management
    management:
      hosts:
        siem-server:
          ansible_host: 10.10.0.50
          ansible_user: ubuntu
        monitor-server:
          ansible_host: 10.10.0.60
          ansible_user: ubuntu
        secops-soar:
          ansible_host: 10.10.0.70
          ansible_user: ubuntu

    # Tier 1 - Core Services
    core:
      hosts:
        core-services:
          ansible_host: 10.10.10.10
          ansible_user: ubuntu
        ad-dc:
          ansible_host: 10.10.10.100
          ansible_user: Administrator
          ansible_connection: winrm
          ansible_port: 5986
          ansible_winrm_scheme: https
          ansible_winrm_server_cert_validation: ignore
          ansible_winrm_transport: basic

    # Tier 2 - Workloads (Production)
    workloads:
      hosts:
        linux-target:
          ansible_host: 10.10.20.10
          ansible_user: ubuntu
        alpine-target:
          ansible_host: 10.10.20.20
          ansible_user: root
        windows-target:
          ansible_host: 10.10.20.100
          ansible_user: Administrator
          ansible_connection: winrm
          ansible_port: 5986
          ansible_winrm_scheme: https
          ansible_winrm_server_cert_validation: ignore
          ansible_winrm_transport: basic

    # Group associations
    linux_nodes:
      children:
        management:
        core:
          hosts:
            core-services:
        workloads:
          hosts:
            linux-target:
            alpine-target:

    windows_nodes:
      children:
        core:
          hosts:
            ad-dc:
        workloads:
          hosts:
            windows-target:
